<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visible Capture Sample Table</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        color: #18202f;
        font-family: system-ui, sans-serif;
        background: #f7f8fb;
      }

      main {
        max-width: 860px;
        margin: 0 auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
      }

      th,
      td {
        padding: 12px;
        border: 1px solid #dce2ec;
        text-align: left;
      }

      th {
        background: #e4f4f4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fictional Supply List</h1>
      <p>This local sample contains generic visible table data.</p>

      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Category</th>
            <th>Status</th>
            <th>Quantity</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Notebook Set</td>
            <td>Office</td>
            <td>Ready</td>
            <td>24</td>
          </tr>
          <tr>
            <td>Canvas Tote</td>
            <td>Event</td>
            <td>Pending Review</td>
            <td>12</td>
          </tr>
          <tr>
            <td>Desk Lamp</td>
            <td>Workspace</td>
            <td>Ready</td>
            <td>8</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
